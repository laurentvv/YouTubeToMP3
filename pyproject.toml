[project]
name = "youtubetomp3"
version = "1.0.0"
description = "Téléchargeur et convertisseur de vidéos et playlists YouTube en MP3 via yt-dlp et FFmpeg"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "laurentvv" }
]
dependencies = [
    "rich>=15.0.0",
    "toml>=0.10.2",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
]

